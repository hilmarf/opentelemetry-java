name: sync-fork
on:
  schedule:
    - cron: '4 2 * * 4,2'
  workflow_dispatch:
permissions:
  contents: write
  workflow: write
jobs:
  sync-fork:
    runs-on: ubuntu-latest
    steps:
      - run: gh repo sync $REPOSITORY -b $BRANCH_NAME
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
